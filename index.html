<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171820" />
  <title>최요원의 아이폰</title>
  <meta name="apple-mobile-web-app-title" content="최요원의 아이폰" />
  <meta property="og:title" content="최요원의 아이폰" />
  <style>
    :root { font-family: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-synthesis:none; }
    * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body { margin:0; min-height:100%; }
    body { background:radial-gradient(ellipse at 45% 0%,#292638,#11131b 52%,#080a0f); color:white; display:grid; place-items:center; min-height:100svh; padding:10px; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid #638fff; outline-offset:2px; }
    .phone { width:min(350px,calc(100vw - 24px),calc((100svh - 26px) * .483)); aspect-ratio:392/812; position:relative; border-radius:11% / 5.4%; background:linear-gradient(105deg,#303039,#0a0a11 20%,#17151d 72%,#3d3c45); border:2px solid #797985; box-shadow:0 26px 70px #0009, inset 0 0 0 2px #12121b, 0 0 0 1px #08080b; padding:0; isolation:isolate; }
    .phone::before { content:"";position:absolute;inset:5px;border-radius:10% / 5%;border:1px solid #393942;pointer-events:none; }
    .speaker { position:absolute; left:50%;top:5.25%;width:16%;height:0.68%;border-radius:999px; background:#08080d;transform:translateX(-50%);box-shadow:0 1px 1px #45454e; }
    .camera { position:absolute; width:2.7%;aspect-ratio:1;top:5%;left:32%;border-radius:50%;background:radial-gradient(circle at 58% 42%,#163f59,#0b1019 45%,#020409 75%);border:2px solid #232332; }
    .front-sensor { position:absolute;top:2.2%;left:49%;width:1.8%;aspect-ratio:1;border-radius:50%;background:#07070e; }
    .power-key { position:absolute;right:-4px;top:20%;height:8%;width:4px;background:#55545e;border-radius:0 4px 4px 0; }
    .volume-keys { position:absolute;left:-4px;top:18%;height:9%;width:4px;border-radius:4px 0 0 4px;background:#5b5964;box-shadow:0 72px #5b5964; }
    .screen { position:absolute;left:4.2%;right:4.2%;top:9.1%;bottom:10.05%;background:#161a27;overflow:hidden;border-radius:2px;box-shadow:0 0 0 2px #07080c; }
    .home-hardware { position:absolute;left:50%;bottom:2.1%;transform:translateX(-50%);width:12.2%;aspect-ratio:1;border-radius:50%;border:2px solid #50505b;background:linear-gradient(145deg,#0a0a0f,#16151b);box-shadow:inset 0 0 0 2px #0a0a0f,0 1px 2px #000b; }
    .home-hardware:active { filter:brightness(1.45); }
    .wallpaper { position:absolute;inset:0;overflow:hidden;background:linear-gradient(152deg,#282d52 0%,#615578 35%,#b2779b 68%,#d3a6a1 100%); }
    .wallpaper::before { content:"";position:absolute;width:145%;height:65%;left:-25%;top:12%;border-radius:50%;background:radial-gradient(ellipse at 55% 40%,#dfb2aa80,transparent 66%);transform:rotate(-28deg);filter:blur(12px); }
    .wallpaper::after { content:"";position:absolute;width:130%;height:48%;left:-25%;bottom:-15%;border-radius:50%;background:linear-gradient(30deg,#3e405f9e,#69779a78 56%,#f2b6a167);transform:rotate(-19deg);filter:blur(5px); }
    .screen.theme-sage .wallpaper { background:linear-gradient(155deg,#193b43,#427d86 44%,#8dafa0 70%,#dcbb9a); }
    .screen.theme-rose .wallpaper { background:linear-gradient(155deg,#603b58,#a56e8d 40%,#deb09e 75%,#f8d9b6); }
    .status { position:absolute;z-index:10;top:0;left:0;right:0;height:25px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:10px;font-weight:650;letter-spacing:-.1px;pointer-events:none;text-shadow:0 1px 2px #0004; }
    .status.dark {color:#242832;text-shadow:none;}
    .status-left,.status-right {display:flex;align-items:center;gap:3px;min-width:75px;}
    .status-right {justify-content:flex-end;}
    .status-time {font-size:10.5px;font-weight:700;}
    .signal {font-size:9px;letter-spacing:-1.5px;margin-right:3px;}
    .battery-shape {height:10px;width:18px;border:1.3px solid currentColor;border-radius:2px;position:relative;display:inline-flex;align-items:center;padding:1px;}
    .battery-shape::after {content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0;}
    .battery-fill {height:100%;border-radius:1px;background:currentColor;}
    .screen-body {position:absolute;inset:0;z-index:2;}
    .lock {height:100%;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;cursor:pointer;color:#fff;text-shadow:0 1px 4px #27304242;}
    .lock-date {padding-top:15.1%;font-size:16px;font-weight:500;letter-spacing:-.5px;}
    .lock-clock {margin-top:-2px;font-size:clamp(48px,12.2vw,65px);line-height:1.14;letter-spacing:-4px;font-weight:200;font-variant-numeric:tabular-nums;}
    .lock-widgets {display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 18px;width:100%;margin-top:6%;}
    .lock-widget {min-height:25px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;text-align:center;border-radius:7px;background:#ffffff25;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff20;padding:4px 5px;box-shadow:0 3px 13px #161b2918;}
    .lock-widget .eyebrow {font-size:8px;font-weight:600;color:#fffc;display:block;margin-bottom:3px;}
    .widget-row {display:flex;align-items:center;gap:6px;}
    .widget-battery {width:20px;height:11px;border:1px solid #fff;border-radius:3px;padding:1px;position:relative;display:flex;}
    .widget-battery::after {content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;border-radius:0 2px 2px 0;background:white;}
    .widget-battery span {height:100%;background:white;border-radius:1px;}
    .widget-value {font-size:10px;font-weight:650;letter-spacing:-.3px;line-height:1;}
    .heart-name {display:inline;font-size:9px;font-weight:650;white-space:nowrap;}
    .heart-name b {color:#ffc5d7;font-size:11px;margin-right:2px;}
    .heart-score {font-size:9px;font-weight:650;letter-spacing:-.3px;display:inline;}
    .unlock-hint {position:absolute;bottom:28px;left:0;right:0;font-size:12px;letter-spacing:.2px;opacity:.94;animation:blink 3s ease-in-out infinite;}
    @keyframes blink {0%,100%{opacity:.95}50%{opacity:.56}}
    .tiny-lock {display:block;font-size:20px;margin-bottom:5px;}
    .passcode {position:relative;height:100%;display:flex;flex-direction:column;align-items:center;color:#fff;}
    .passcode .pass-title {font-size:17px;margin-top:23%;font-weight:550;}
    .passcode .pass-subtitle {font-size:11px;opacity:.75;margin-top:6px;}
    .pass-dots {display:flex;gap:15px;margin:23px 0 19px;}
    .pass-dot {height:11px;width:11px;border:1.5px solid white;border-radius:50%;}
    .pass-dot.filled {background:white;}
    .num-pad {display:grid;grid-template-columns:repeat(3,1fr);gap:9px 27px;align-items:center;justify-items:center;}
    .num {border:0;border-radius:50%;width:66px;height:66px;color:#fff;background:#ffffff38;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:27px;font-weight:350;line-height:1;}
    .num small {font-size:7px;letter-spacing:1px;margin-top:5px;font-weight:600;}
    .num:active {background:#ffffff6d;}
    .num.empty {visibility:hidden;}
    .pass-bottom {width:100%;display:flex;justify-content:space-between;padding:0 34px;margin-top:16px;}
    .text-btn {border:0;color:inherit;background:transparent;font-size:12px;padding:8px 0;}
    .home {height:100%;padding:40px 12px 0;position:relative;display:flex;flex-direction:column;color:white;}
    .app-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 4px;justify-items:center;}
    .app-link {border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;width:100%;text-shadow:0 1px 4px #232a39ad;padding:0;}
    .app-link:active .app-icon {transform:scale(.92);filter:brightness(.9);}
    .app-label {font-size:11px;font-weight:500;white-space:nowrap;}
    .app-icon {height:49px;width:49px;border-radius:11px;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 2px 7px #20233624,inset 0 1px 1px #ffffff3d;flex-shrink:0;transition:transform .12s;}
    .ic-phone,.ic-message {background:linear-gradient(150deg,#6ae06e,#24b64b);}
    .ic-photos {background:#fff;}
    .ic-settings {background:linear-gradient(135deg,#b6bac4,#7d8490);}
    .ic-calendar {background:#fff;color:#262c30;display:flex;flex-direction:column;justify-content:flex-start;padding-top:7px;}
    .ic-clock {background:#fcfcfc;}
    .ic-notes {background:linear-gradient(#ffdb62 0 23%,#fffef7 23% 100%);}
    .ic-safari {background:linear-gradient(145deg,#e8f8ff,#bfdde5);}
    .ic-chatgpt {background:#161b21;}
    .ic-kakao {background:#ffdf32;color:#342d28;}
    .ic-music {background:linear-gradient(160deg,#ff8d95,#fb2a68);}
    .calendar-icon-head {font-size:10px;color:#e64f55;font-weight:650;}
    .calendar-icon-day {font-size:31px;line-height:1.18;font-weight:300;}
    .analog {width:46px;height:46px;border-radius:50%;border:2px solid #191b22;background:#fff;position:relative;}
    .analog::before {content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#111;top:calc(50% - 2.5px);left:calc(50% - 2.5px);z-index:3;}
    .analog .hand {position:absolute;left:50%;bottom:50%;transform-origin:bottom center;background:#14161b;border-radius:2px;}
    .analog .hour {height:12px;width:2.8px;margin-left:-1.4px;}
    .analog .minute {height:18px;width:2px;margin-left:-1px;}
    .analog .second {height:20px;width:1px;margin-left:-.5px;background:#e65b4d;}
    .analog.big {width:160px;height:160px;border-width:5px;box-shadow:0 5px 20px #0001;}
    .analog.big .hour {height:43px;width:6px;margin-left:-3px;}
    .analog.big .minute {height:62px;width:4px;margin-left:-2px;}
    .analog.big .second {height:69px;width:2px;margin-left:-1px;}
    .analog.big::before {width:9px;height:9px;top:calc(50% - 4.5px);left:calc(50% - 4.5px);}
    .compass {width:47px;height:47px;border:3px solid #fff;border-radius:50%;background:linear-gradient(140deg,#4fc1fb,#167be5);box-shadow:0 1px 4px #0002;display:grid;place-items:center;transform:rotate(15deg);font-size:30px;color:#fff;}
    .notes-symbol {width:34px;height:26px;border-left:3px solid #efd66a;box-shadow:5px 0 0 -2px #f3d364;}
    .chatgpt-symbol {font-size:43px;line-height:1;font-weight:300;color:#fff;transform:rotate(15deg);}
    .kakao-symbol {background:#302d2b;color:#ffdf32;border-radius:47% 47% 47% 12%;padding:12px 5px 10px;font-size:12px;font-weight:900;letter-spacing:-.6px;}
    .photo-flower {width:41px;height:41px;position:relative;}
    .photo-petal {position:absolute;top:2px;left:15px;width:12px;height:21px;border-radius:95% 95% 60% 60%;transform-origin:6px 19px;opacity:.89;}
    .flower-center {position:absolute;left:17px;top:17px;width:8px;height:8px;background:#fff;border-radius:50%;}
    .dock {margin-top:auto;margin-bottom:12px;background:#f5f4ff48;border:1px solid #ffffff30;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;padding:12px 2px 9px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;box-shadow:0 8px 35px #0b102322;}
    .dock .app-label {display:none;}
    .dock .app-icon {height:51px;width:51px;}
    .app-host {height:100%;}
    .app-page {height:100%;padding-top:26px;display:flex;flex-direction:column;background:#f5f5f8;color:#20222a;}
    .app-page.theme-dark {background:#14151b;color:#f5f5f7;}
    .appbar {min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:0 14px;border-bottom:1px solid #e5e5eb;background:#fbfbfdea;}
    .theme-dark .appbar {background:#1e1f28;border-bottom-color:#34353e;}
    .appbar strong {font-size:17px;font-weight:660;white-space:nowrap;}
    .back-btn,.header-action {font-size:13px;background:transparent;border:0;color:#3378e6;padding:8px 0;min-width:48px;text-align:left;}
    .header-action {text-align:right;font-weight:650;}
    .app-body {overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding:14px;overscroll-behavior:contain;scrollbar-width:thin;}
    .app-body.no-padding {padding:0;}
    .screen-heading {font-size:28px;margin:10px 0 18px;font-weight:750;letter-spacing:-1px;}
    .muted {color:#898a95;font-size:12px;line-height:1.65;}
    .section-title {font-size:13px;color:#777a87;font-weight:750;margin:14px 2px 7px;}
    .panel {background:#fff;border-radius:14px;box-shadow:0 1px 3px #0000000b;padding:14px;margin-bottom:12px;}
    .theme-dark .panel {background:#242631;box-shadow:none;}
    .list-row {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 3px;border-bottom:1px solid #ededf0;}
    .list-row:last-child {border-bottom:0;}
    .theme-dark .list-row {border-color:#3b3b45;}
    .list-row b {font-size:14px;}
    .list-row small {color:#9295a0;display:block;margin-top:4px;}
    .plain-row {width:100%;text-align:left;border:0;background:transparent;color:inherit;}
    .primary-btn {border:0;border-radius:11px;padding:12px 16px;background:#3a81f5;color:#fff;font-weight:680;font-size:13px;}
    .secondary-btn {border:0;border-radius:11px;padding:11px 14px;background:#e8eaf0;color:#3c4353;font-size:13px;font-weight:600;}
    .theme-dark .secondary-btn {background:#393a44;color:#f2f2f5;}
    .field {width:100%;border:1px solid #e2e4eb;border-radius:11px;padding:12px 13px;background:white;color:#20222a;font-size:14px;outline:none;}
    textarea.field {resize:vertical;min-height:145px;line-height:1.7;}
    .form-stack {display:grid;gap:10px;}
    .tabbar {height:54px;flex-shrink:0;display:flex;justify-content:space-around;align-items:stretch;border-top:1px solid #e7e7ec;background:#fcfcfd;}
    .theme-dark .tabbar {background:#1e1f28;border-color:#353640;}
    .tab {width:100%;border:0;background:transparent;color:#999aa5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;}
    .tab.active {color:#2879ec;font-weight:700;}
    .tab svg {width:18px;height:18px;}
    .empty-state {min-height:215px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#9699a3;gap:9px;}
    .empty-state .empty-icon {font-size:44px;line-height:1;opacity:.75;}
    .empty-state b {color:#666977;font-size:15px;}
    .theme-dark .empty-state b {color:#e8e8eb;}
    .dial-display {height:100px;display:flex;align-items:flex-end;justify-content:center;font-size:26px;font-weight:400;letter-spacing:1px;white-space:nowrap;overflow:hidden;}
    .dial-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:11px 17px;justify-items:center;max-width:264px;margin:15px auto;}
    .dial-key {width:66px;height:66px;border-radius:50%;border:0;background:#e5e5e9;color:#222;font-size:26px;}
    .dial-key small {display:block;font-size:8px;letter-spacing:1px;}
    .dial-actions {display:flex;align-items:center;justify-content:center;gap:40px;margin-top:6px;}
    .dial-call {height:64px;width:64px;border:0;border-radius:50%;background:#2fc45f;color:white;display:grid;place-items:center;}
    .square-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;}
    .photo-item {aspect-ratio:1;border:0;padding:0;background:#ddd;overflow:hidden;}
    .photo-item img {width:100%;height:100%;object-fit:cover;}
    .photo-full {max-width:100%;max-height:76%;object-fit:contain;display:block;margin:22px auto;}
    .month-nav {display:flex;align-items:center;justify-content:space-between;margin:4px 0 15px;}
    .month-nav h2 {font-size:24px;margin:0;}
    .nav-controls {display:flex;gap:12px;}
    .nav-controls button {border:0;background:transparent;color:#3378e6;font-size:22px;padding:3px;}
    .month-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center;}
    .weekday {font-size:10px;color:#9a9ba4;margin:4px 0 9px;font-weight:700;}
    .day {border:0;background:transparent;min-height:41px;border-radius:50%;color:#333;font-size:13px;position:relative;}
    .day.today {background:#e5eafb;}
    .day.selected {background:#337cf3;color:white;}
    .day.sunday {color:#e26368;}
    .day.selected.sunday {color:white;}
    .day.has-event::after {content:"";position:absolute;bottom:4px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:#e58aa5;}
    .pill {font-size:11px;padding:6px 9px;border-radius:8px;background:#f2f3f7;color:#545969;}
    .theme-dark .pill {background:#343644;color:#c5c7d3;}
    .note-editor {display:flex;flex-direction:column;height:100%;gap:9px;}
    .note-editor textarea {flex:1;resize:none;border:0;border-radius:8px;padding:12px;min-height:180px;outline:none;font-size:14px;line-height:1.8;background:#fff;}
    .note-editor input {border:0;outline:none;border-radius:8px;background:#fff;font-weight:750;font-size:21px;padding:13px 12px;}
    .chat-thread {display:flex;flex-direction:column;gap:11px;min-height:100%;padding:16px 11px;}
    .bubble {max-width:78%;border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
    .bubble.me {margin-left:auto;background:#6fa8ef;color:#fff;border-bottom-right-radius:5px;}
    .bubble.other {margin-right:auto;background:#e9e9ee;color:#292c36;border-bottom-left-radius:5px;}
    .kakao-screen .bubble.me {background:#ffe36b;color:#292521;}
    .kakao-screen .bubble.other {background:#fff;color:#292521;}
    .chat-compose {display:flex;gap:7px;align-items:center;padding:9px;background:#f5f5f8;border-top:1px solid #ddd;}
    .chat-compose input {flex:1;min-width:0;border:0;border-radius:18px;padding:10px 12px;background:#fff;}
    .chat-compose button {border:0;border-radius:50%;background:#3683ef;color:#fff;width:36px;height:36px;}
    .kakao-screen .app-page {background:#c9d4e2;}
    .kakao-screen .chat-compose {background:#e4e8ec;}
    .clock-layout {display:flex;flex-direction:column;align-items:center;padding:26px 0 16px;gap:14px;}
    .clock-time {font-size:36px;font-weight:280;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
    .stopwatch {font-size:42px;text-align:center;font-variant-numeric:tabular-nums;font-weight:290;margin:55px 0 38px;}
    .browser-logo {display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:28px 0 20px;color:#3378e6;font-size:40px;}
    .quick-links {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;}
    .quick-link {padding:12px 5px;border:0;background:#fff;border-radius:12px;font-size:12px;color:#45516c;}
    .quick-link span {display:block;font-size:24px;margin-bottom:7px;}
    .chatgpt-brand {font-size:66px;text-align:center;margin:32px auto 10px;color:#f7f7f8;}
    .hero-center {text-align:center;padding:12px 12px 20px;}
    .hero-center h2 {font-size:23px;margin:8px 0;}
    .hero-center p {font-size:13px;line-height:1.75;color:#b4b7c3;}
    .music-cover {border-radius:22px;aspect-ratio:1;width:78%;margin:22px auto 16px;background:linear-gradient(135deg,#ad678b,#5c597f 58%,#2d3c58);display:grid;place-items:center;font-size:76px;color:#ffffffc9;box-shadow:0 15px 25px #12132120;}
    .setting-meter {width:100%;height:11px;border-radius:10px;background:#e5e5e9;overflow:hidden;}
    .setting-meter span {display:block;height:100%;background:#56c778;}
    .color-options {display:flex;gap:10px;margin:13px 0 5px;}
    .color-option {height:52px;flex:1;border:3px solid transparent;border-radius:12px;}
    .color-option.selected {border-color:#427ce6;outline:2px solid #fff;}
    .color-option[data-color="dusk"] {background:linear-gradient(140deg,#282d52,#b2779b,#d3a6a1);}
    .color-option[data-color="sage"] {background:linear-gradient(140deg,#193b43,#427d86,#dcbb9a);}
    .color-option[data-color="rose"] {background:linear-gradient(140deg,#603b58,#a56e8d,#f8d9b6);}
    .bottom-toast {position:absolute;z-index:30;left:15px;right:15px;bottom:18px;border-radius:14px;padding:11px 12px;background:#222736f0;color:white;font-size:12px;line-height:1.5;text-align:center;box-shadow:0 8px 22px #0003;pointer-events:none;}
    .incoming-scene{position:absolute;z-index:45;inset:0;color:white;background:linear-gradient(165deg,#414552,#15171e 67%,#090a0e);display:flex;flex-direction:column;align-items:center;text-align:center;padding:95px 20px 70px;box-sizing:border-box}
    .incoming-scene .incoming-label{color:#c9cbd2;font-size:14px;margin-bottom:13px}

.call-scene button.call-control{appearance:none!important;-webkit-appearance:none!important;border:0!important;outline-offset:2px!important;background:transparent!important;padding:0!important;margin:0!important;width:auto!important;min-width:0!important;box-shadow:none!important;border-radius:0!important;color:#fff!important;font:inherit!important;display:flex!important;flex-direction:column!important;align-items:center!important;gap:6px!important;cursor:pointer!important}
.call-scene .call-controls .call-control>span.call-svg-icon{width:52px!important;height:52px!important;min-width:52px!important;min-height:52px!important;max-width:52px!important;max-height:52px!important;border-radius:50%!important;background:rgba(255,255,255,.20)!important;display:flex!important;align-items:center!important;justify-content:center!important;color:#fff!important;font-size:0!important;box-sizing:border-box!important}
.call-scene .call-controls .call-control.call-selected>span.call-svg-icon{background:#fff!important;color:#272831!important}
.call-scene .call-controls .call-control>span.call-svg-icon svg{height:25px!important;width:25px!important;min-height:25px!important;min-width:25px!important;display:block!important;stroke:currentColor!important;overflow:visible!important}
.call-scene .call-controls .call-control>span.call-svg-icon svg[fill="currentColor"]{fill:currentColor!important}
.call-scene .call-controls .call-control small{font-size:10px!important;white-space:nowrap!important;color:#fff!important;font-weight:400!important}

/* Neutral ChatGPT home icon, independent of browser/app icon assets */
.app-grid .app-icon.ic-chatgpt, .app-link .app-icon.ic-chatgpt, .app-icon.ic-chatgpt {
  background:linear-gradient(155deg,#31353d,#13161c) !important;
  background-color:#1a1d23 !important;
  color:#fff !important;
  box-shadow:0 3px 9px #10131c66,inset 0 1px 1px #ffffff2d !important;
}
.app-icon.ic-chatgpt .chatgpt-symbol {color:#fff!important;text-shadow:none!important;}

/* ChatGPT icon: override green styles on mobile Safari */
.ic-chatgpt,
.app-icon.ic-chatgpt,
.app-grid .app-icon.ic-chatgpt,
.app-link .app-icon.ic-chatgpt {
  background: #1c1c1e !important;
  background-color: #1c1c1e !important;
  background-image: none !important;
  color: #ffffff !important;
}
.app-icon.ic-chatgpt svg,
.app-icon.ic-chatgpt .chatgpt-symbol {
  color: #ffffff !important;
}

.call-scene .call-current{font-size:17px!important;line-height:1.55!important;min-height:66px!important;max-width:94%!important;padding:7px 10px!important;align-items:center!important;}

.call-scene .call-controls .call-control small{font-size:12px!important;}
.phone-entry b{font-size:16px!important;}
.phone-entry small{font-size:12px!important;}

    function ensureContactWheelScroll(){
      const area=screen.querySelector('.app-host:has(.phone-entries) .app-body, .kakao-screen:has(.kakao-friends-intro) .app-body');
      if(!area||area.dataset.wheelAssist==='1')return;
      area.dataset.wheelAssist='1';
      area.addEventListener('wheel',event=>{
        if(area.scrollHeight<=area.clientHeight+1)return;
        if(event.ctrlKey)return;
        const prev=area.scrollTop;
        area.scrollTop+=event.deltaY;
        if(prev!==area.scrollTop)event.preventDefault();
      },{passive:false});
    }

    function commitKakaoMessage(form){
      if(state.app!=='kakao'||!state.threadId)return false;
      const input=form.querySelector('[name="message"]');
      const msg=String(input?.value||'').trim();
      if(!msg)return false;
      
      const obj=state.kakao.find(t=>t.id===state.threadId);
      if(!obj)return false;
      if(jaegwanReplyPending&&obj.id==='k-pinned-jaegwan')return false;
      clearInterval(jaegwanTypingTimer);
      obj.messages.push({text:msg,mine:true});
      const isJaegwan=obj.id==='k-pinned-jaegwan';
      let reply;
      if(isJaegwan){
        const step=Math.max(0,Number(store.get('jaegwanDraftStep',0))||0);
        const scripted=jaegwanDrafts[step];
        reply=scripted && msg===scripted.out ? scripted.reply : simulateKakaoReply(obj,msg);
        if(scripted && msg===scripted.out)store.set('jaegwanDraftStep',step+1);
      }else reply=simulateKakaoReply(obj,msg);
      obj.lastReadIndex=obj.messages.length;
      markKakaoActive(obj);
      if(reply===null){render();return true;}
      if(isJaegwan){
        jaegwanReplyPending=true;
        jaegwanTypingVisible=true;
      }
      render();
      const roomId=obj.id;
      const thinkingDelay=isJaegwan?Math.max(1900,Math.min(3600,1100+reply.length*38)):950;
      clearTimeout(isJaegwan?jaegwanReplyTimer:null);
      const replyTask=setTimeout(()=>{
        const room=state.kakao.find(t=>t.id===roomId);
        if(!room)return;
        room.messages.push(...String(reply).split("\n").map(text=>({text,mine:false})));
        const currentlyOpen=state.app==='kakao'&&state.threadId===roomId;
        if(currentlyOpen)room.lastReadIndex=room.messages.length;
        if(isJaegwan){
          jaegwanReplyPending=false;
          jaegwanTypingVisible=false;
        }
        markKakaoActive(room);
        if(state.app==='kakao')render();
        if(!currentlyOpen)showPhoneNotice('kakao',room.name,reply,roomId);
      },thinkingDelay);
      if(isJaegwan)jaegwanReplyTimer=replyTask;
      return true;
    }

    document.addEventListener('keydown',e=>{
      if(state.off) return;
      if(state.mode==='passcode'){if(/^\d$/.test(e.key)){enterDigit(e.key);e.preventDefault();}else if(e.key==='Backspace'){state.pass=state.pass.slice(0,-1);render();e.preventDefault();}else if(e.key==='Escape'){lock();}}
      else if(e.key==='Escape' && document.activeElement?.tagName!=='INPUT' && document.activeElement?.tagName!=='TEXTAREA'){goHome();}
      else if((e.key==='Enter'||e.key===' ')&&state.mode==='lock'){state.mode='passcode';render();}
    });

    setInterval(tick,100);
    render();
    // 암호 해제 후 홈 진입 시 1회 수신 장면 시작. 버튼은 연출상 동작하지 않는다.
  setTimeout(fetchMusicTitles, 1200);
  </script>
</body>
